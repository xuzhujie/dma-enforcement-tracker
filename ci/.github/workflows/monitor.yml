# 注意：本文件需要移动到 .github/workflows/monitor.yml 才能生效
# 在 GitHub 网页上：进入本文件 → 右上角编辑 → 将路径改为 .github/workflows/monitor.yml → Commit
name: DMA 动态监测

on:
  schedule:
    # 每天 UTC 06:17 运行（北京时间 14:17）
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取 Press Corner 并更新动态数据
        run: python scripts/check_updates.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/updates.json
          if git diff --cached --quiet; then
            echo "无新动态，跳过提交"
          else
            git commit -m "chore: 自动更新 DMA 动态监测数据"
            git push
          fi
